# SonarQube / SonarCloud Project Configuration
# Documentation:
# - Overview: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/overview
# - Python: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/python-test-coverage
# - JS/TS: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/javascript-typescript-test-coverage

sonar.projectKey=minhazul73_lavender
sonar.organization=minhazul73
sonar.projectName=Lavender
sonar.projectVersion=0.5.0
sonar.sourceEncoding=UTF-8

# Source and Test directories
sonar.sources=server,frontend/src
sonar.tests=tests,frontend/src
sonar.test.inclusions=tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,server/dist/**,frontend/dist/**,**/node_modules/**,**/.venv/**,**/*.egg-info/**,coverage/**,frontend/coverage/**

# Backend Test Coverage (Python - Cobertura XML format generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Frontend Test Coverage (JavaScript / TypeScript - LCOV format generated by Vitest)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

