name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint backend (Ruff)
        run: uv run ruff check server/ tests/ || true
        # || true: non-blocking during initial adoption. Remove in a future task.

      - name: Run pytest (with coverage on Python 3.11)
        if: matrix.python-version == '3.11'
        run: uv run --python 3.11 pytest --cov=server --cov-report=xml:coverage.xml --cov-report=term -v

      - name: Run pytest
        if: matrix.python-version != '3.11'
        run: uv run --python ${{ matrix.python-version }} pytest -v

      - name: Upload backend coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 1

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type check (TypeScript)
        working-directory: frontend
        run: bun run typecheck

      - name: Run frontend unit tests with coverage
        working-directory: frontend
        run: bun run test:coverage

      - name: Lint frontend
        working-directory: frontend
        run: bun run lint || true
        # || true: warnings don't fail CI yet. Remove || true in a future task.

      - name: Build production bundle
        working-directory: frontend
        run: bun run build

      - name: Upload frontend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 1

  sonar:
    name: SonarQube Analysis
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Check for SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN secret is not set. Skipping SonarQube analysis."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0 # Full git history required for Sonar analysis

      - name: Download backend coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-coverage
          path: .

      - name: Download frontend coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Cache SonarQube packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=minhazul73
            -Dsonar.projectKey=minhazul73_lavender

