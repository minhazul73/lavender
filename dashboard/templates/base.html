<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Device Dashboard{% endblock %}</title>
    <meta name="description" content="Real-time Linux device monitoring dashboard for Redmi Note 7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/live.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">HD</div>
            <div class="brand">
                <h1>Device Dashboard</h1>
                <span class="subtitle">Redmi Note 7</span>
            </div>
        </div>

        <nav class="nav">
            <a href="/" id="nav-overview" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
                <span class="nav-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                    </svg>
                </span>
                Overview
            </a>
            <a href="/services" id="nav-services" class="nav-item {% if request.url.path.startswith('/services') %}active{% endif %}">
                <span class="nav-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
                    </svg>
                </span>
                Services
            </a>
            <a href="/processes" id="nav-processes" class="nav-item {% if request.url.path.startswith('/processes') %}active{% endif %}">
                <span class="nav-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                </span>
                Processes
            </a>
            <a href="/network" id="nav-network" class="nav-item {% if request.url.path.startswith('/network') %}active{% endif %}">
                <span class="nav-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                </span>
                Network
            </a>
            <a href="/battery" id="nav-battery" class="nav-item {% if request.url.path.startswith('/battery') %}active{% endif %}">
                <span class="nav-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="16" height="10" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13"/>
                    </svg>
                </span>
                Battery
            </a>
            <a href="/packages" id="nav-packages" class="nav-item {% if request.url.path.startswith('/packages') %}active{% endif %}">
                <span class="nav-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
                    </svg>
                </span>
                Packages
            </a>
            <a href="/users" id="nav-users" class="nav-item {% if request.url.path.startswith('/users') %}active{% endif %}">
                <span class="nav-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                </span>
                Users
            </a>
            <a href="/power" id="nav-power" class="nav-item {% if request.url.path.startswith('/power') %}active{% endif %}">
                <span class="nav-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
                    </svg>
                </span>
                Power
            </a>
        </nav>

        <div class="sidebar-footer">
            <span class="version">v1.0.0</span>
            <span style="color: var(--text-muted); font-size: 10px;">RN7 Linux</span>
        </div>
    </aside>

    <!-- Main -->
    <main class="main">
        <header class="topbar">
            <h2 class="page-title">{% block page_title %}Overview{% endblock %}</h2>
            <div class="topbar-actions">
                <span id="sse-status" class="">
                    <span class="status-indicator status-inactive"></span>
                    <span id="sse-status-text">Connecting…</span>
                </span>
            </div>
        </header>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </main>
</div>

<!-- Confirmation Modal -->
<div id="confirm-modal" class="modal" style="display:none;">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <div class="modal-content">
        <h3 id="confirm-title">Are you sure?</h3>
        <p id="confirm-message"></p>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-danger" id="confirm-button">Confirm</button>
        </div>
    </div>
</div>

<script src="/static/script.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
