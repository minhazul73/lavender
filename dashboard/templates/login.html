<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Lavender</title>
    <meta name="description" content="Sign in to Lavender with system credentials">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v={{ git_hash }}">
    <style>
        body.login-body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 20%, #171d2b 0%, #0a0d14 80%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary, #f1f5f9);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-sizing: border-box;
        }

        .login-card {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-icon-wrap {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(99, 102, 241, 0.15));
            border: 1px solid rgba(56, 189, 248, 0.25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            color: #38bdf8;
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 6px 0;
            letter-spacing: -0.02em;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted, #94a3b8);
            margin: 0;
        }

        .login-alert {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-alert.info {
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.3);
            color: #38bdf8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary, #cbd5e1);
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .login-input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(10, 14, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            color: #fff;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        .login-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
            background: rgba(15, 23, 42, 0.9);
        }

        .btn-submit {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
        }

        .btn-submit:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted, #64748b);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body class="login-body">
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon-wrap">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/>
                    <rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
                    <line x1="6" y1="6" x2="6.01" y2="6"/>
                    <line x1="6" y1="18" x2="6.01" y2="18"/>
                </svg>
            </div>
            <h1 class="login-title">Lavender</h1>
            <p class="login-subtitle">Redmi Note 7 • System Management</p>
        </div>

        <div id="error-box" class="login-alert" style="display: none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="error-text"></span>
        </div>

        <form id="login-form" method="POST" action="/auth/login">
            <input type="hidden" name="next" id="next-field" value="/" />
            
            <div class="form-group">
                <label class="form-label" for="username">System Username</label>
                <div class="input-wrap">
                    <input type="text" id="username" name="username" class="login-input" placeholder="e.g. rahat" required autofocus autocomplete="username" />
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" class="login-input" placeholder="Enter system password" required autocomplete="current-password" />
                </div>
            </div>

            <button type="submit" id="btn-login" class="btn-submit">
                <span>Sign In</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
        </form>

        <div class="login-footer">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Authenticates directly via Linux system credentials</span>
        </div>
    </div>
</div>

<script>
    // Extract query parameters for errors or next target
    const params = new URLSearchParams(window.location.search);
    const err = params.get('error');
    const msg = params.get('msg');
    const next = params.get('next');

    if (next) {
        document.getElementById('next-field').value = next;
    }

    const errBox = document.getElementById('error-box');
    const errText = document.getElementById('error-text');

    if (err) {
        errText.textContent = decodeURIComponent(err.replace(/\+/g, ' '));
        errBox.style.display = 'flex';
    } else if (msg) {
        errText.textContent = decodeURIComponent(msg.replace(/\+/g, ' '));
        errBox.className = 'login-alert info';
        errBox.style.display = 'flex';
    }

    // Interactive form submission with nice button state
    document.getElementById('login-form').addEventListener('submit', async function(e) {
        const btn = document.getElementById('btn-login');
        btn.disabled = true;
        btn.innerHTML = '<span>Authenticating…</span>';
    });
</script>
</body>
</html>
